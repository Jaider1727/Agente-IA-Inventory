# Instance-per-tenant deployment for a single VPS.
#
# - Caddy terminates HTTPS (automatic Let's Encrypt) and routes each client
#   subdomain to that client's container over the internal network.
# - Each client is one app container with its own env file. App containers are
#   NOT published to the host — only Caddy exposes 80/443.
# - PostgreSQL runs here on the VPS: one shared server, one database + role per
#   client. The DB is NOT published to the host — only the app containers reach
#   it over the internal network, so the connection needs no TLS.
#
# IMPORTANT: the pg_data volume holds every client's data. BACK IT UP (see README).
#
# Set POSTGRES_PASSWORD in deploy/.env before starting.
# Build the image once:  docker build -t agente-facturacion:latest ..

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432" # internal only — never published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [web]

  # Web GUI for Postgres (pgAdmin, the official admin tool).
  # Bound to the VPS localhost only — reach it through an SSH tunnel, never
  # expose a DB admin panel to the public internet.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in deploy/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in deploy/.env}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [web]

  # ── One block per client. Copy, rename, point to its env file. ──
  cliente1:
    image: agente-facturacion:latest
    restart: unless-stopped
    env_file: ./.env.cliente1
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000" # internal only — reachable by Caddy as cliente1:3000
    networks: [web]

  cliente2:
    image: agente-facturacion:latest
    restart: unless-stopped
    env_file: ./.env.cliente2
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks: [web]

networks:
  web:

volumes:
  caddy_data:  # persists issued certificates across restarts
  caddy_config:
  pg_data:     # ALL client databases live here — back it up
  pgadmin_data: # pgAdmin saved servers and config
